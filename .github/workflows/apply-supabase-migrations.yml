name: Apply Supabase DB Migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run solo muestra migraciones; apply las aplica en Supabase'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: 'Para aplicar migraciones escribe exactamente: APPLY_MIGRATIONS'
        required: false
        default: ''
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF or SUPABASE_PROJECT_ID" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)

      - name: Link Supabase project
        shell: bash
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview migrations
        if: ${{ github.event.inputs.mode == 'dry-run' }}
        shell: bash
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Check apply confirmation
        if: ${{ github.event.inputs.mode == 'apply' }}
        shell: bash
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY_MIGRATIONS" ]; then
            echo "To apply migrations, set confirm to APPLY_MIGRATIONS"
            exit 1
          fi

      - name: Apply migrations
        if: ${{ github.event.inputs.mode == 'apply' }}
        shell: bash
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

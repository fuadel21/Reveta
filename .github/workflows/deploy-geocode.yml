name: Deploy Geocode Function

on:
  workflow_dispatch:

jobs:
  deploy-geocode:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy geocode-location without JWT verification
        run: supabase functions deploy geocode-location --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"

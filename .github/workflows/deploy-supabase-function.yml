name: Deploy Supabase AI Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/ai-listing-assistant/**"
      - ".github/workflows/deploy-supabase-function.yml"

permissions:
  contents: read

concurrency:
  group: deploy-supabase-ai-listing-assistant
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ai-listing-assistant
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Comprobar secretos necesarios
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Falta el secreto SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Desplegar ai-listing-assistant
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy ai-listing-assistant \
            --project-ref "$SUPABASE_PROJECT_REF"

name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      SENDCLOUD_PUBLIC_KEY: ${{ secrets.SENDCLOUD_PUBLIC_KEY }}
      SENDCLOUD_SECRET_KEY: ${{ secrets.SENDCLOUD_SECRET_KEY }}
      SENDCLOUD_SHIPPING_METHOD_ID: ${{ secrets.SENDCLOUD_SHIPPING_METHOD_ID }}
      ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN || 'https://reveta.es' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF or SUPABASE_PROJECT_ID" && exit 1)

      - name: Set Supabase secrets
        shell: bash
        run: |
          supabase secrets set ALLOWED_ORIGIN="$ALLOWED_ORIGIN" --project-ref "$SUPABASE_PROJECT_REF"
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            supabase secrets set STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "STRIPE_SECRET_KEY not set. Stripe payment functions will fail until this secret is added."
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            supabase secrets set STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "STRIPE_WEBHOOK_SECRET not set. Stripe webhook signature verification will fail until this secret is added."
          fi
          if [ -n "$SENDCLOUD_PUBLIC_KEY" ] && [ -n "$SENDCLOUD_SECRET_KEY" ]; then
            supabase secrets set SENDCLOUD_PUBLIC_KEY="$SENDCLOUD_PUBLIC_KEY" --project-ref "$SUPABASE_PROJECT_REF"
            supabase secrets set SENDCLOUD_SECRET_KEY="$SENDCLOUD_SECRET_KEY" --project-ref "$SUPABASE_PROJECT_REF"
            if [ -n "$SENDCLOUD_SHIPPING_METHOD_ID" ]; then
              supabase secrets set SENDCLOUD_SHIPPING_METHOD_ID="$SENDCLOUD_SHIPPING_METHOD_ID" --project-ref "$SUPABASE_PROJECT_REF"
            fi
          else
            echo "Sendcloud secrets not set. Shipping function will fail until these secrets are added."
          fi

      - name: Deploy Edge Functions
        shell: bash
        run: |
          supabase functions deploy create-payment-intent --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy create-boost-payment-intent --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy create-sendcloud-parcel --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy geocode-location --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
